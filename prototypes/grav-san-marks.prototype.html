<!DOCTYPE html>
<!--
  PROTÓTIPO DESCARTÁVEL — não faz parte do app, não altera index.html nem js/.

  Pergunta: como mostrar, visualmente, os componentes que o motor inferiu COM bônus de
  utevo grav san (component.gravSanActive === true), em dois lugares:
    (1) os gráficos de turno do fim da página (componentes / hits / dano / Impact Analyser)
    (2) o painel "Detalhes do turno".

  É a PÁGINA REAL (index.html copiado, caminhos ../) + prototypes/proto-grav-san-marks.js,
  que embrulha renderClassifierCharts/renderTurnDetail e decora o resultado.
  3 variantes em ?variant=A|B|C, barra flutuante embaixo (← / → também trocam).

  Atalho de carga (servidor estático na raiz do repo, ex. `python -m http.server 5599`):
    /prototypes/grav-san-marks.prototype.html?sv=gloompillar%20Server%20Log.txt&lc=gloompillar%20Local%20Chat.txt
  (&pair=N escolhe a sessão quando o arquivo tem várias). Sem isso, carregue os logs como sempre.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protótipo — marcas de grav san</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="proto-grav-san-marks.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1 data-i18n="cls_title">Classificador</h1>
    <span class="spacer"></span>
    <button id="langPt" class="guide-btn active" data-i18n="btn_lang_pt">PT</button>
    <button id="langEn" class="guide-btn" data-i18n="btn_lang_en">EN</button>
  </div>

  <p class="proto-flag">PROTÓTIPO — marcas de grav san (descartável)</p>

  <p class="desc" data-i18n="cls_desc">
    Cole o <strong>server log</strong> e o <strong>local chat</strong> da mesma hunt.
  </p>

  <div class="val-controls">
    <button id="btnClsLocalFile" class="btn-blue" data-i18n="cls_load_local">abrir local chat .txt</button>
    <input type="file" id="clsLocalFileInput" accept=".txt,.log" style="display:none">
    <button id="btnClsServerFile" class="btn-blue" data-i18n="cls_load_server">abrir server log .txt</button>
    <input type="file" id="clsServerFileInput" accept=".txt,.log" style="display:none">
    <select id="clsPairSelect" multiple style="display:none"></select>
    <button id="btnClassify">classificar Unified</button>
    <span id="clsStatus" class="sim-status" data-i18n="cls_status_ready">cole os dois logs abaixo</span>
  </div>

  <div class="logs-grid">
    <div>
      <label data-i18n="cls_local_label">local chat</label>
      <textarea id="clsLocalInput" data-i18n-placeholder="cls_local_ph" placeholder="Cole aqui o local chat..."></textarea>
    </div>
    <div>
      <label data-i18n="cls_server_label">server log</label>
      <textarea id="clsServerInput" data-i18n-placeholder="cls_server_ph" placeholder="Cole aqui o server log..."></textarea>
    </div>
  </div>

  <div id="clsResults" style="display:none"></div>

</div>

<div class="proto-switcher" id="protoSwitcher">
  <button type="button" id="protoPrev" aria-label="variante anterior">&larr;</button>
  <span id="protoLabel"></span>
  <button type="button" id="protoNext" aria-label="próxima variante">&rarr;</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/stats.js"></script>
<script src="../js/mob-element-mods.js"></script>
<script src="../js/mob-element-mods-post-2026-06-16.js"></script>
<script src="../js/unified-session-context.js"></script>
<script src="../js/unified-formulas.js"></script>
<script src="../js/unified-parsing.js"></script>
<script src="../js/unified-setup-inference.js"></script>
<script src="../js/unified-validation.js"></script>
<script src="../js/unified-turn-resolution.js"></script>
<script src="../js/unified-classification-engine.js"></script>
<script src="../js/unified-main.js"></script>
<script src="../js/session-summary.js"></script>
<script src="../js/histogram.js"></script>
<script src="../js/charts-helpers.js"></script>
<script src="../js/app.js"></script>
<script src="proto-grav-san-marks.js"></script>
</body>
</html>
